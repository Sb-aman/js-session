<!-- some excercise like when we press start then fact is started print and when press stop fact stopped -->
<script>
    let url = "https://catfact.ninja/fact"

    func = async function practise() {
        try {
            let c = await axios.get(url)
            return c.data.fact  //agar return nhi kiya to undefined btayega
        } catch (error) {
            console.log("error ", error)
            return "no record found";
        }

    }
    let c = document.querySelector('#start')
    c.addEventListener('click', () => {
        console.log("fact started")
        newFunc = setInterval(async () => {
            let e = await func();
            console.log(e)

        }, 1000);
    })
    let d = document.querySelector('#stop')
    d.addEventListener('click', () => {
        clearInterval(newFunc);
        console.log("fact stopped")
    }) 
</script>
